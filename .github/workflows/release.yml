# Release
# Label a PR (release:major|minor|patch|none) before merging.
# On merge to main, PR Version Bot bumps VERSION.md, prepends CHANGELOG.md,
# syncs package.json, tags, and publishes a GitHub Release. Starts at v0.1.0.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Run PR Version Bot
        uses: kaji-labs/pr-version-bot@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-file: VERSION.md
          changelog-file: CHANGELOG.md
          sync-package-json: 'true'
          update-readme: 'true'
          generate-badge: 'true'
